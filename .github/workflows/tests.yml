name: tests

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Graphviz system dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends graphviz
          dot -V
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run test suite (incl. regression baseline + backend parity)
        run: python -m unittest discover -s tests -v
      - name: Parity gate (oracle vs API vs r4pm)
        run: python tools/parity_gate.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and build (includes TypeScript check)
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
