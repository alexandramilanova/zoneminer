name: tests

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Graphviz system dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends graphviz
          dot -V
      - name: Install dependencies
        run: pip install --require-hashes -r requirements-test.txt
      - name: Run test suite (incl. regression baseline + backend parity)
        run: python -m unittest discover -s tests -v
      - name: Parity gate (oracle vs API vs r4pm)
        run: python tools/parity_gate.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build browser test application
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npx playwright install --with-deps chromium
      - name: Start isolated browser test API
        run: |
          ZONE_ANALYTICS_DATA_DIR="$RUNNER_TEMP/zoneminer-e2e" uvicorn backend.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/zoneminer-api.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/api/health; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8000/api/health
      - name: Browser regression tests
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:8000
        run: npm run test:e2e -- --project=chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-details
          path: frontend/test-results

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and build (includes TypeScript check)
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
          node --test tests/replay-index.test.mjs tests/request-queue.test.mjs
